name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # Safety net: nothing in this job may upload to Zephyr.
      ZE_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm lint
      - run: pnpm nx affected -t typecheck test
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      # Builds every app with Zephyr disabled, serves the builds and runs the smoke + axe tests.
      - run: pnpm nx run portal-e2e:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Zephyr
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Zephyr reads branch, commit and author from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      # `build` is uncached and uploads to Zephyr, so only changed apps get a new version.
      - run: pnpm nx affected -t build --output-style=static
        # Scoped to this step so install scripts never see the token.
        env:
          ZE_CI_TOKEN: ${{ secrets.ZEPHYR_CI_TOKEN }}
          ZE_FAIL_BUILD: "true"
